<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Primary School Management System" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>Primary School Management System</title>
    <script>
      // Apply the stored theme before first paint so the page never flashes the
      // wrong palette. The store rewrites this class once React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('sms.theme');
          var mode = stored ? JSON.parse(stored).state.mode : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (error) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
